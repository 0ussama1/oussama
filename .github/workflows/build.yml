name: Build APK Final

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev zlib1g-dev
          pip install --user --upgrade "setuptools<66.0" "cython<3.0" buildozer virtualenv

      - name: 4. Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # التنظيف الإجباري قبل البناء
          buildozer android clean
          yes | buildozer android debug

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OussamaSat-App
          path: bin/*.apk
