name: Final Success Build
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix Distutils & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev zlib1g-dev
          # الحل النهائي: تثبيت نسخ تضمن وجود distutils وتوافق p4a
          pip install --upgrade pip
          pip install "setuptools<66.0" "cython<3.0" buildozer virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # استخدام --requirements بدقة كما ظهر في خطأ الصورة 1000023975
          yes | buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OussamaSat-Final
          path: bin/*.apk
