name: Build APK Professionnel OussamaSat

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilation de l'application Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installation des dépendances du système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pip install --user --upgrade buildozer cython virtualenv setuptools

      - name: 4. Compilation avec Buildozer (NDK 25b)
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Commande automatique pour accepter toutes les licences SDK
          yes | buildozer android debug

      - name: 5. Publication de l'artefact (Fichier APK)
        uses: actions/upload-artifact@v4
        with:
          name: OussamaSat-App-Final
          path: bin/*.apk
