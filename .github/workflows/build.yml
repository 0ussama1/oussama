name: Build APK OussamaSat Final

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code source
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installation Outils (Sûr)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev zlib1g-dev
          pip install --user --upgrade "setuptools<66.0" "cython<3.0" buildozer virtualenv

      - name: 4. Build APK (Manuel)
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Accepter les licences et compiler
          yes | buildozer android debug

      - name: 5. Envoyer APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-OussamaSat
          path: bin/*.apk
