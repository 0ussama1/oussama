name: Build APK Final OussamaSat

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.10 (Crucial)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Fixed Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev zlib1g-dev
          # تثبيت الأدوات بنسخ محددة لمنع تضارب Python 3.12
          pip install --user --upgrade "setuptools<66.0" "cython<3.0" buildozer virtualenv

      - name: 4. Build APK (Manuel)
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # قبول التراخيص وبدء البناء
          yes | buildozer android debug

      - name: 5. Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: OussamaSat-App
          path: bin/*.apk
