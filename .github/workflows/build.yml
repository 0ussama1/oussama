name: Build APK OussamaSat Final

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev zlib1g-dev
          pip install --user --upgrade "setuptools<66.0" buildozer "cython<3.0" virtualenv

      - name: 3. Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # ملاحظة: حذفنا أمر الـ clean لتجنب ضياع الملفات
          yes | buildozer android debug

      - name: 4. Download
        uses: actions/upload-artifact@v4
        with:
          name: OussamaSat-App
          path: bin/*.apk
